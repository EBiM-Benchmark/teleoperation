# Native Fast DDS on domain 0, matching the TMR robot's stack and the Jetson Orin.
# All participants in a ROS 2 graph must share one RMW, so LABS moves rather than the
# robot. Domain 0 is the default domain and is therefore shared with anything else ROS 2
# on the LAN - the interfaceWhiteList in fastdds_labs.xml is what actually isolates us,
# by making the office NIC invisible to DDS.
# Both env var spellings are set: Fast DDS 2.x reads FASTRTPS_*, 3.x reads FASTDDS_*.
x-ros-environment: &common-ros-env
  ROS_DOMAIN_ID: 0
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp
  FASTRTPS_DEFAULT_PROFILES_FILE: /workspace/fastdds_labs.xml
  FASTDDS_DEFAULT_PROFILES_FILE: /workspace/fastdds_labs.xml

x-app-environment: &common-app-env
  LOG_LEVEL: INFO

services:
  data-collection:
    image: registry.localhost/labs/data-collection:latest
    container_name: data-collection
    network_mode: host
    restart: unless-stopped
    stop_signal: SIGINT
    privileged: true
    # Solution for dds connectivity between different containers (ipc and pid set to host)
    # https://robotics.stackexchange.com/questions/87845/ros2-connectivity-across-docker-containers-via-host-driver
    ipc: host
    pid: host
    stdin_open: true # docker run -i
    tty: true # docker run -t
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./config_station.yml:/workspace/config_station.yml
      - ./config_tasks.yml:/workspace/config_tasks.yml
      - ./config_data_collection.yml:/workspace/config_data_collection.yml
      - ${DATA_ROOT:-../../data}:/workspace/data
      - ./fastdds_labs.xml:/workspace/fastdds_labs.xml:ro
    environment:
      <<: [*common-ros-env, *common-app-env]
      XAUTHORITY: /tmp/.docker.xauth
      DISPLAY: ${DISPLAY}
      TERM: ${TERM}
      QT_X11_NO_MITSHM: 1
      TF_CPP_MIN_LOG_LEVEL: 1

  data-recorder:
    image: registry.localhost/labs/data-recorder:latest
    container_name: data-recorder
    network_mode: host
    restart: unless-stopped
    stop_signal: SIGINT
    privileged: true
    # Solution for dds connectivity between different containers (ipc and pid set to host)
    # https://robotics.stackexchange.com/questions/87845/ros2-connectivity-across-docker-containers-via-host-driver
    ipc: host
    pid: host
    shm_size: '1gb'
    stdin_open: true # docker run -i
    tty: true # docker run -t
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_ROOT:-../../data}:/workspace/data
      - ./config_data_recorder.yml:/workspace/config_data_recorder.yml
      - ./fastdds_labs.xml:/workspace/fastdds_labs.xml:ro
    environment:
      <<: [*common-ros-env, *common-app-env]
      DISPLAY: ${DISPLAY}

  data-processor:
    image: registry.localhost/labs/data-processor:latest
    container_name: data-processor
    network_mode: host
    restart: unless-stopped
    privileged: true
    stdin_open: true
    tty: true
    environment:
      <<: *common-app-env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_ROOT:-../../data}:/workspace/data
      - ./config_data_processor.yml:/workspace/config_data_processor.yml

