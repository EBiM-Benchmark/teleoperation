[workspace]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-humble"]
name = "teleoperation"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Rebuild the laptop-side packages for THIS env. Separate build/install/log trees from
# the teleop_inputs container's (Python 3.10 vs 3.12 here) - see configs/teleop_common.sh.
build-teleop = """colcon --log-base log_pixi build --symlink-install \
  --packages-up-to tmr_pedal_teleop pedal_state_publisher keyboard_state_publisher \
  franka_gello_state_publisher franka_gello_state_subscriber \
  --build-base build_pixi --install-base install_pixi \
  --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python3"""

# Foot-pedal teleoperation on the host, against install_pixi/ and ROS_DOMAIN_ID 0.
# Needs a real TTY for the `m` DRIVE/RECORD toggle, and configs/99-tmr-footswitch.rules
# installed, or the pedals are unreadable.
[tasks.pedal]
cmd = "./start_pedal.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

# GELLO -> both arms + both grippers. Independent of the pedal stack: neither needs the
# other, and stopping one leaves the other running. Needs both OpenRB-150 serial devices.
[tasks.gello]
cmd = "./start_gello.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

# Both halves, in the required order.
[tasks.teleop]
cmd = "./start_teleop.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
cxx-compiler = ">=2.0.0,<3"
evdev = ">=1.9.3,<2"
dynamixel-sdk = ">=4.0.5,<5"
ros-humble-rqt-image-view = ">=1.2.0,<2"
